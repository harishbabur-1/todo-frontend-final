<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - bat-note</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <a href="index.html" class="back-link">&larr; Back to bat-note</a>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Enter the command center and take control of your tasks.</p>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" required>

            <label>Password</label>
            <input type="password" id="loginPassword" required>

            <button type="submit" class="button full">Login</button>
        </form>

        <p id="loginMessage" class="message"></p>
        <p class="switch-text">Don't have an account? <a href="register.html">Register</a></p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
