<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - bat-note</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <a href="index.html" class="back-link">&larr; Back to bat-note</a>
        <h1>Create account</h1>
        <p class="auth-subtitle">Create your identity for a sharper way to manage your tasks.</p>

        <form id="registerForm">
            <label>Email</label>
            <input type="email" id="registerEmail" required>

            <label>Password</label>
            <input type="password" id="registerPassword" required minlength="1">

            <button type="submit" class="button full">Register</button>
        </form>

        <p id="registerMessage" class="message"></p>
        <p class="switch-text">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
